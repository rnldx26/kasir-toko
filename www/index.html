<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasir Toko</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F8F5;--sf:#fff;--ink:#17201C;--mut:#6D7570;--ln:#E8E9E4;--ac:#0B7A5F;--aci:#fff;--bad:#B93A26;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1513;--sf:#19211E;--ink:#EAF0EC;--mut:#98A39D;--ln:#27302C;--ac:#3DCBA3;--aci:#06231B;--bad:#F08A78}}
:root[data-theme="dark"]{--bg:#0F1513;--sf:#19211E;--ink:#EAF0EC;--mut:#98A39D;--ln:#27302C;--ac:#3DCBA3;--aci:#06231B;--bad:#F08A78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font-size:15px;line-height:1.4}
header{padding:16px 20px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:19px;font-weight:800;letter-spacing:-.01em}
header span{color:var(--mut);font-size:12.5px;background:var(--sf);padding:6px 11px;border-radius:20px}
main{flex:1;overflow-y:auto;padding:4px 20px 20px}
nav{display:flex;background:var(--sf);border-top:1px solid var(--ln)}
nav button{flex:1;padding:9px 0 8px;border:0;background:none;color:var(--mut);font-weight:600;font-size:11.5px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--ac)}nav svg{width:22px;height:22px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h2{font-size:13px;color:var(--mut);font-weight:600;margin:22px 0 8px}
input,select{width:100%;height:46px;padding:0 14px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--ink);font:inherit;margin-bottom:8px;outline:0}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 18%,transparent)}
label{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 5px}
button{font-family:inherit;cursor:pointer}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0}
.srch{display:flex;gap:8px;position:sticky;top:0;background:var(--bg);padding:6px 0 4px;z-index:2}.srch input{margin:0}
.icb{width:46px;height:46px;flex:none;border:0;border-radius:12px;background:var(--ac);color:var(--aci);display:grid;place-items:center}.icb svg{width:22px;height:22px}
.sec{height:46px;padding:0 14px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--ink);font-weight:600;margin-bottom:8px}
.pri{width:100%;height:50px;border:0;border-radius:12px;background:var(--ac);color:var(--aci);font-weight:700;font-size:15.5px;margin-top:8px}
.it{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--ln)}
.it small{color:var(--mut);display:block;font-size:12.5px;margin-top:1px}.low{color:var(--bad)!important}
.it b{font-variant-numeric:tabular-nums;font-weight:600}
.qb,.plus{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
.qb{background:var(--ac);color:var(--aci)}.plus{background:var(--sf);color:var(--ac);border:1px solid var(--ln);font-size:18px}
.q{display:flex;align-items:center;gap:12px}.q button{width:32px;height:32px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font-size:18px;line-height:1}
.tt{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0}.tt b{font-size:17px;font-variant-numeric:tabular-nums}.tt.big b{font-size:24px}
.chips{display:flex;gap:8px;margin-bottom:8px}.chips button{flex:1;height:38px;border:1px solid var(--ln);border-radius:20px;background:var(--sf);color:var(--ink);font-weight:600;font-size:13px}
.empty{color:var(--mut);padding:14px 0;font-size:14px}
#bar{margin:0 16px 12px;padding:14px 18px;border-radius:14px;background:var(--ink);color:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
#bar[hidden]{display:none}#bar b{font-size:17px;font-variant-numeric:tabular-nums}#bar .go{opacity:.7;font-size:13px}
dialog{border:0;border-radius:18px;width:min(92vw,420px);background:var(--bg);color:var(--ink);padding:18px}
dialog::backdrop{background:#0007}
dialog.sheet{width:100%;max-width:520px;margin:auto auto 0;border-radius:22px 22px 0 0;max-height:90vh;padding:8px 20px calc(18px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;justify-content:space-between;align-items:center}.sh h2{margin:14px 0 4px;font-size:17px;color:var(--ink);font-weight:800}
.x{border:0;background:var(--sf);width:34px;height:34px;border-radius:50%;color:var(--mut);font-size:15px}
video{width:100%;border-radius:12px;background:#000}
#ts{position:fixed;inset:auto auto 100px 50%;transform:translateX(-50%);margin:0;border:0;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:22px;font-size:14px;max-width:90vw;width:max-content;overflow:visible}
#prt{display:none}
@media print{body>*:not(#prt){display:none!important}#prt{display:block;font:12px monospace;white-space:pre;width:58mm}}
</style></head>
<body>
<header><b id="hn"></b><span id="ht"></span></header>
<main id="v"></main>
<div id="bar" hidden onclick="openCart()"></div>
<nav><button data-t="k"><svg viewBox="0 0 24 24"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Kasir</button><button data-t="p"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Produk</button><button data-t="r"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Laporan</button><button data-t="t"><svg viewBox="0 0 24 24"><path d="M3 9l2-5h14l2 5"/><path d="M5 9v11h14V9"/><path d="M10 20v-5h4v5"/></svg>Toko</button></nav>
<dialog id="fd"><h2 id="ft" style="margin-top:0"></h2>
<label>Nama produk</label><input id="fn">
<label>Barcode</label><div class="row"><input id="fb" inputmode="numeric"><button class="ic" onclick="scan(c=>$('#fb').value=c)">Scan</button></div>
<label>Harga jual (Rp)</label><input id="fp" inputmode="numeric">
<label>Stok</label><input id="fs" inputmode="numeric">
<div class="row"><button class="sec" onclick="$('#fd').close()">Batal</button><button class="sec" id="fx" style="color:var(--bad)" onclick="delP()">Hapus</button><button class="pri" style="margin:0 0 8px" onclick="saveP()">Simpan</button></div></dialog>
<dialog id="sd"><video id="vid" playsinline muted></video><p class="empty" id="sm">Arahkan kamera ke barcode</p><button class="sec" onclick="stopScan()">Tutup</button></dialog>
<dialog id="cs" class="sheet"><div class="sh"><h2>Keranjang</h2><button class="x" onclick="$('#cs').close()" aria-label="Tutup">✕</button></div>
<div id="cl"></div>
<label>Pelanggan (opsional)</label><div class="row"><input id="cn" placeholder="Nama" list="cdl" oninput="cin()"><input id="ch" inputmode="tel" placeholder="No. HP" oninput="cust.h=this.value"></div><datalist id="cdl"></datalist>
<div class="tt big"><span>Total</span><b id="tot"></b></div>
<input id="pay" inputmode="numeric" placeholder="Uang diterima" oninput="chg()">
<div class="chips"><button onclick="qp(0)">Uang pas</button><button onclick="qp(50000)">50rb</button><button onclick="qp(100000)">100rb</button></div>
<div class="tt"><span>Kembalian</span><b id="kb"></b></div>
<button class="pri" onclick="pay()">Bayar sekarang</button></dialog>
<dialog id="rd"><h2 style="margin-top:0">Transaksi tersimpan</h2><div id="rt"></div>
<button class="sec" style="width:100%" onclick="out(rcpt(cur))">Cetak ke printer</button>
<div class="row"><button class="sec" style="flex:1" onclick="exp('jpg')">Simpan JPG</button><button class="sec" style="flex:1" onclick="exp('pdf')">Simpan PDF</button></div>
<button class="pri" style="margin:0" onclick="$('#rd').close()">Selesai</button></dialog>
<div id="ts" popover="manual"></div><div id="prt"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
let D={store:{name:'Toko Saya',addr:'',tel:'',foot:'Terima kasih sudah berbelanja',w:32,mode:'bt'},products:[],sales:[]};
try{const x=JSON.parse(localStorage.getItem('kasir')||'null');if(x)D=Object.assign(D,x)}catch(e){}
const save=()=>{try{localStorage.setItem('kasir',JSON.stringify(D))}catch(e){}};
let cart={},tab='k',editId=null,ch=null,pname='',tt;
function toast(m){const t=$('#ts');t.textContent=m;try{t.hidePopover()}catch(e){}try{t.showPopover()}catch(e){}clearTimeout(tt);tt=setTimeout(()=>{try{t.hidePopover()}catch(e){}},2600)}
function hd(){$('#hn').textContent=D.store.name||'Kasir';const d=new Date().toDateString();$('#ht').textContent='Hari ini '+rp(D.sales.filter(s=>new Date(s.t).toDateString()==d).reduce((a,s)=>a+s.total,0))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));({k:vK,p:vP,r:vR,t:vT})[t]();hd();bar()}

/* ---------- Kasir ---------- */
const I={scan:'<svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M4 12h16"/></svg>'};
let cust={n:'',h:''};
const custs=()=>{const m={};D.sales.forEach(s=>{if(s.c&&s.c.n)m[s.c.n]=s.c.h||m[s.c.n]||''});return m};
function cin(){cust.n=$('#cn').value;const k=custs()[cust.n];if(k&&!$('#ch').value){$('#ch').value=k;cust.h=k}}
function vK(){$('#v').innerHTML=`<div class="srch"><input id="q" type="search" placeholder="Cari produk atau ketik barcode" autocomplete="off"><button class="icb" aria-label="Scan barcode" onclick="scan(c=>addBy(c))">${I.scan}</button></div><div id="res"></div>`;
$('#q').oninput=rl;$('#q').onkeydown=e=>{if(e.key==='Enter')addBy($('#q').value.trim())};rc()}
function rl(){const k=$('#q').value.toLowerCase();const a=D.products.filter(p=>!k||p.name.toLowerCase().includes(k)||p.barcode.includes(k)).slice(0,30);
$('#res').innerHTML=a.length?a.map(p=>`<div class="it" onclick="add('${p.id}')"><div style="flex:1">${esc(p.name)}<small class="${p.stock<=0?'low':''}">Stok ${p.stock}</small></div><b>${rp(p.price)}</b>${cart[p.id]?`<em class="qb">${cart[p.id]}</em>`:'<span class="plus">+</span>'}</div>`).join(''):`<p class="empty">${D.products.length?'Produk tidak ditemukan.':'Belum ada produk. Tambahkan dulu di tab Produk.'}</p>`}
function addBy(c){if(!c)return;let p=D.products.find(x=>x.barcode===c);if(!p){const k=c.toLowerCase(),m=D.products.filter(x=>x.name.toLowerCase().includes(k));if(m.length==1)p=m[0]}
if(!p)return toast('Produk tidak ditemukan');add(p.id);$('#q').value='';rl()}
function add(id){cart[id]=(cart[id]||0)+1;rc()}
function qty(id,d){cart[id]+=d;if(cart[id]<=0)delete cart[id];rc()}
const total=()=>Object.entries(cart).reduce((a,[id,q])=>a+q*D.products.find(p=>p.id==id).price,0);
function bar(){const n=Object.values(cart).reduce((a,b)=>a+b,0),b=$('#bar');b.hidden=!(tab==='k'&&n);b.innerHTML=`<span>${n} barang</span><b>${rp(total())}</b><span class="go">Lihat keranjang ›</span>`}
function rc(){bar();if(tab==='k'&&$('#q'))rl();if($('#cs').open)drawCart()}
function openCart(){drawCart();$('#cn').value=cust.n;$('#ch').value=cust.h;$('#cdl').innerHTML=Object.keys(custs()).map(n=>`<option value="${esc(n)}">`).join('');$('#cs').showModal()}
function drawCart(){const e=Object.entries(cart);if(!e.length){$('#cs').close();return}
$('#cl').innerHTML=e.map(([id,q])=>{const p=D.products.find(x=>x.id==id);return`<div class="it"><div style="flex:1">${esc(p.name)}<small>${rp(p.price)}</small></div><div class="q"><button onclick="qty('${id}',-1)">−</button><b>${q}</b><button onclick="qty('${id}',1)">+</button></div></div>`}).join('');$('#tot').textContent=rp(total());chg()}
function chg(){const t=total(),p=+$('#pay').value||t;$('#kb').textContent=p>=t?rp(p-t):'Kurang '+rp(t-p)}
function qp(v){$('#pay').value=v||'';chg()}
async function pay(){const it=Object.entries(cart).map(([id,q])=>{const p=D.products.find(x=>x.id==id);return{id,n:p.name,p:p.price,q}});if(!it.length)return toast('Keranjang masih kosong');
const t=total(),paid=+$('#pay').value||t;if(paid<t)return toast('Uang kurang '+rp(t-paid));
const s={t:Date.now(),items:it,total:t,paid,c:{n:cust.n.trim(),h:cust.h.trim()}};it.forEach(i=>{D.products.find(x=>x.id==i.id).stock-=i.q});D.sales=D.sales.concat(s).slice(-200);save();
cart={};cust={n:'',h:''};$('#pay').value='';$('#cs').close();rc();hd();showR(s)}

/* ---------- Produk ---------- */
let mg=false,sel=new Set();
function vP(){mg=false;sel.clear();$('#v').innerHTML=`<div class="row"><button class="pri" style="margin:0 0 10px;flex:2" onclick="openP()">Tambah produk</button><button class="sec" style="flex:1;margin-bottom:10px" id="mgb" onclick="togMg()">Kelola</button></div><div id="mb"></div><input id="pq" placeholder="Cari produk"><div id="pl"></div>`;$('#pq').oninput=lp;lp()}
const vis=()=>{const k=$('#pq').value.toLowerCase();return D.products.filter(p=>!k||p.name.toLowerCase().includes(k)||p.barcode.includes(k))};
function togMg(){mg=!mg;sel.clear();lp()}
function tg(id){sel.has(id)?sel.delete(id):sel.add(id);lp()}
function selAll(){const a=vis(),all=a.every(p=>sel.has(p.id));a.forEach(p=>all?sel.delete(p.id):sel.add(p.id));lp()}
function delSel(){const n=sel.size;if(!n)return toast('Pilih produk yang mau dihapus');if(!confirm('Hapus '+n+' produk terpilih? Riwayat penjualan tidak ikut terhapus.'))return;
D.products=D.products.filter(p=>!sel.has(p.id));sel.forEach(id=>delete cart[id]);sel.clear();save();lp();toast(n+' produk dihapus')}
function lp(){const a=vis();$('#mgb').textContent=mg?'Selesai':'Kelola';
$('#mb').innerHTML=mg?`<div class="row" style="margin-bottom:8px"><button class="sec" style="flex:1" onclick="selAll()">${a.length&&a.every(p=>sel.has(p.id))?'Batal pilih':'Pilih semua'}</button><button class="sec" style="flex:1;color:var(--bad)" onclick="delSel()">Hapus (${sel.size})</button></div>`:'';
$('#pl').innerHTML=a.length?a.map(p=>`<div class="it" onclick="${mg?`tg('${p.id}')`:`openP('${p.id}')`}">${mg?`<input type="checkbox" style="width:22px;height:22px;padding:0;margin:0;pointer-events:none" ${sel.has(p.id)?'checked':''} tabindex="-1">`:''}<div style="flex:1">${esc(p.name)}<small>${esc(p.barcode)||'tanpa barcode'} · stok <span class="${p.stock<=0?'low':''}">${p.stock}</span></small></div><b>${rp(p.price)}</b></div>`).join(''):'<p class="empty">Belum ada produk.</p>'}
function openP(id){editId=id||null;const p=D.products.find(x=>x.id==id)||{name:'',barcode:'',price:'',stock:''};$('#ft').textContent=id?'Ubah produk':'Produk baru';$('#fn').value=p.name;$('#fb').value=p.barcode;$('#fp').value=p.price;$('#fs').value=p.stock;$('#fx').style.display=id?'':'none';$('#fd').showModal()}
function saveP(){const n=$('#fn').value.trim(),b=$('#fb').value.trim(),pr=+$('#fp').value,s=+$('#fs').value||0;if(!n||!(pr>=0)||$('#fp').value==='')return toast('Isi nama dan harga produk');
if(b&&D.products.some(x=>x.barcode===b&&x.id!=editId))return toast('Barcode sudah dipakai produk lain');
if(editId){Object.assign(D.products.find(x=>x.id==editId),{name:n,barcode:b,price:pr,stock:s})}else D.products.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,barcode:b,price:pr,stock:s});
save();$('#fd').close();lp()}
function delP(){if(!confirm('Hapus produk ini?'))return;D.products=D.products.filter(x=>x.id!=editId);delete cart[editId];save();$('#fd').close();lp()}

/* ---------- Toko ---------- */
function vT(){const s=D.store;const f=(k,l,ph)=>`<label>${l}</label><input value="${esc(s[k])}" placeholder="${ph||''}" oninput="D.store.${k}=this.value;save();hd()">`;
$('#v').innerHTML=`<h2>Data toko (tampil di struk)</h2>${f('name','Nama toko')}${f('addr','Alamat')}${f('tel','Telepon')}${f('foot','Pesan di bawah struk')}
<h2>Printer termal</h2><label>Cara cetak</label><select onchange="D.store.mode=this.value;save()"><option value="bt">Bluetooth langsung (Chrome)</option><option value="raw">Aplikasi RawBT</option><option value="web">Dialog cetak browser</option></select>
<label>Lebar kertas</label><select onchange="D.store.w=+this.value;save()"><option value="32">58 mm</option><option value="48">80 mm</option></select>
<button class="sec" style="width:100%" onclick="conn()">Sambungkan printer Bluetooth</button><p class="empty" id="ps">${ch?'Terhubung: '+esc(pname):'Printer belum tersambung.'}</p>
<button class="sec" style="width:100%" onclick="out(rcpt({t:Date.now(),items:[{n:'Tes cetak',p:1000,q:1}],total:1000,paid:1000}))">Cetak struk tes</button>
<h2>Backup data</h2><div class="row"><button class="sec" style="flex:1" onclick="backup()">Unduh backup</button><button class="sec" style="flex:1" onclick="$('#rf').click()">Pulihkan backup</button></div><input type="file" id="rf" accept=".json,application/json" hidden onchange="restore(this)">
<p class="empty">Data tersimpan di HP ini. Unduh backup secara rutin karena menghapus data browser akan menghapus produk dan riwayat.</p>`;
const sl=$('#v').querySelectorAll('select');sl[0].value=s.mode;sl[1].value=s.w}

/* ---------- Struk & printer ---------- */
function rcpt(s){const w=D.store.w,st=D.store,L=[],c=(t,b)=>L.push([t,1,b]),l=t=>L.push([t,0,0]),ln=()=>l('-'.repeat(w));
const row=(a,b)=>l(a+' '.repeat(Math.max(1,w-a.length-b.length))+b),n=x=>x.toLocaleString('id-ID');
c(st.name,1);if(st.addr)c(st.addr);if(st.tel)c(st.tel);ln();l(new Date(s.t).toLocaleString('id-ID'));if(s.c&&s.c.n)l(('Pelanggan: '+s.c.n).slice(0,w));if(s.c&&s.c.h)l('HP: '+s.c.h);ln();
s.items.forEach(i=>{l(i.n.slice(0,w));row(i.q+' x '+n(i.p),n(i.q*i.p))});ln();
row('TOTAL',rp(s.total));row('BAYAR',rp(s.paid));row('KEMBALI',rp(s.paid-s.total));ln();if(st.foot)c(st.foot);return L}
const enc=s=>new TextEncoder().encode(s.replace(/[^\x20-\x7E]/g,'?'));
function bytes(L){const o=[27,64];L.forEach(([t,c,b])=>o.push(27,97,c?1:0,27,69,b?1:0,...enc(t),10));o.push(10,10,10);return new Uint8Array(o)}
async function conn(){try{if(!navigator.bluetooth)return toast('Bluetooth web tidak didukung. Buka di Chrome Android.');
const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['000018f0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455']});
const g=await d.gatt.connect();for(const sv of await g.getPrimaryServices())for(const c of await sv.getCharacteristics())if(c.properties.write||c.properties.writeWithoutResponse){ch=c;pname=d.name||'Printer';if($('#ps'))$('#ps').textContent='Terhubung: '+pname;return toast('Printer terhubung')}
toast('Printer ini tidak bisa dipakai lewat Bluetooth web. Coba RawBT.')}catch(e){toast('Gagal menyambung: '+e.message)}}
async function out(L){try{const m=D.store.mode;if(m==='bt'){if(!ch||!ch.service.device.gatt.connected)return toast('Printer belum tersambung. Sambungkan di tab Toko.');
const b=bytes(L),nr=ch.properties.writeWithoutResponse;for(let i=0;i<b.length;i+=100){const p=b.slice(i,i+100);nr?await ch.writeValueWithoutResponse(p):await ch.writeValue(p)}}
else if(m==='raw')location.href='rawbt:base64,'+btoa(String.fromCharCode(...bytes(L)));
else{$('#prt').textContent=L.map(x=>x[0]).join('\n');print()}}catch(e){toast('Gagal mencetak: '+e.message)}}

/* ---------- Scan barcode ---------- */
let stream=null,scanning=false;
async function scan(cb){if(!('BarcodeDetector' in window))return toast('Scan kamera butuh Chrome Android. Ketik barcode atau pakai scanner USB/Bluetooth.');
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return toast('Kamera tidak bisa dibuka. Izinkan akses kamera.')}
const v=$('#vid');v.srcObject=stream;await v.play();$('#sd').showModal();scanning=true;
const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});
(async function lp(){while(scanning){try{const r=await det.detect(v);if(r.length){const c=r[0].rawValue;stopScan();return cb(c)}}catch(e){}await new Promise(r=>setTimeout(r,250))}})()}
function stopScan(){scanning=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if($('#sd').open)$('#sd').close()}
$('#sd').addEventListener('close',stopScan);
/* ---------- Unduh, backup, laporan ---------- */
async function dl(name,data){try{const d=window.claude&&claude.use?await claude.use('downloads'):null;
if(d){await d.save({filename:name,data});return toast('File disimpan')}
const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=name;a.click();toast('File diunduh')}catch(e){if(!e||e.code!=='declined')toast('Gagal menyimpan file')}}
const ld=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function backup(){dl('backup-kasir-'+ld(Date.now())+'.json',JSON.stringify(D))}
function restore(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.products)||!Array.isArray(x.sales)||!x.store)throw 0;if(!confirm('Ganti semua data saat ini dengan isi backup ini?'))return;x.store=Object.assign({w:32,mode:'bt'},x.store);D=x;cart={};save();hd();vT();toast('Backup dipulihkan')}catch(e){toast('File backup tidak valid')}};r.readAsText(f);i.value=''}
let cur=null;
function showR(s){cur=s;setTimeout(()=>prep(s),50);$('#rt').innerHTML=`<b style="font-size:22px">${rp(s.total)}</b><div class="empty" style="padding:2px 0 10px">Kembalian ${rp(s.paid-s.total)}</div>`;$('#rd').showModal()}
function rcv(L){const w=D.store.w,fs=22,lh=30,W=Math.round(w*fs*.6+48),H=L.length*lh+48,s=2,c=document.createElement('canvas');c.width=W*s;c.height=H*s;const x=c.getContext('2d');x.scale(s,s);x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';x.textBaseline='top';
L.forEach(([t,ce,b],i)=>{x.font=(b?'bold ':'')+fs+'px monospace';x.textAlign=ce?'center':'left';x.fillText(t,ce?W/2:24,24+i*lh)});return c}
function pdfOf(jpg,w,h,pw){const ph=(pw*h/w).toFixed(2),E=new TextEncoder(),parts=[],off=[];let len=0;
const push=x=>{const b=typeof x==='string'?E.encode(x):x;parts.push(b);len+=b.length},obj=(n,t)=>{off[n]=len;push(n+' 0 obj\n'+t+'\nendobj\n')};
push('%PDF-1.4\n');obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</I 4 0 R>>>>/Contents 5 0 R>>`);
off[4]=len;push(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`);push(jpg);push('\nendstream\nendobj\n');
const c=`q ${pw} 0 0 ${ph} 0 0 cm /I Do Q`;obj(5,`<</Length ${c.length}>>\nstream\n${c}\nendstream`);
const x=len;push('xref\n0 6\n0000000000 65535 f \n'+[1,2,3,4,5].map(n=>String(off[n]).padStart(10,'0')+' 00000 n \n').join(''));
push(`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`);return new Blob(parts,{type:'application/pdf'})}
let pj=null,busy=false;
function prep(s){const c=rcv(rcpt(s)),j=new Promise(r=>c.toBlob(r,'image/jpeg',.92));pj={s,j,p:j.then(async b=>pdfOf(new Uint8Array(await b.arrayBuffer()),c.width,c.height,D.store.w==32?164:227))}}
async function exp(fmt){if(busy)return;busy=true;toast('Menyiapkan file...');try{if(!pj||pj.s!==cur)prep(cur);const nm='struk-'+ld(cur.t)+'-'+String(cur.t).slice(-5);await dl(nm+'.'+fmt,await(fmt==='jpg'?pj.j:pj.p))}catch(e){toast('Gagal membuat file')}busy=false}
function vR(){$('#v').innerHTML=`<label>Tanggal laporan</label><input type="date" id="rdt" value="${ld(Date.now())}"><div id="rb"></div>`;$('#rdt').onchange=rr;rr()}
const daySales=()=>D.sales.filter(s=>ld(s.t)==$('#rdt').value);
function agg(S){const m={};S.forEach(s=>s.items.forEach(i=>{const o=m[i.n]||(m[i.n]={q:0,v:0});o.q+=i.q;o.v+=i.q*i.p}));return Object.entries(m).sort((a,b)=>b[1].v-a[1].v)}
function rr(){const S=daySales(),T=S.reduce((a,s)=>a+s.total,0),A=agg(S),N=A.reduce((a,x)=>a+x[1].q,0);
$('#rb').innerHTML=`<div class="tt"><span>Total penjualan</span><b>${rp(T)}</b></div><div class="tt"><span>Jumlah transaksi</span><b>${S.length}</b></div><div class="tt"><span>Barang terjual</span><b>${N}</b></div>
<div class="row" style="margin-top:8px"><button class="sec" style="flex:1" onclick="repPrint()">Cetak ringkasan</button><button class="sec" style="flex:1" onclick="repCsv()">Unduh CSV</button></div>
<h2>Produk terjual</h2>${A.length?A.map(([n,o])=>`<div class="it"><div>${esc(n)}<small>${o.q} terjual</small></div><b>${rp(o.v)}</b></div>`).join(''):'<p class="empty">Belum ada penjualan di tanggal ini.</p>'}
<h2>Transaksi (ketuk untuk lihat struk)</h2>${S.map(s=>`<div class="it" onclick="showR(D.sales[${D.sales.indexOf(s)}])"><div>${new Date(s.t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}<small>${s.items.reduce((a,i)=>a+i.q,0)} barang${s.c&&s.c.n?' · '+esc(s.c.n):''}</small></div><b>${rp(s.total)}</b></div>`).join('')||'<p class="empty">Tidak ada transaksi.</p>'}`}
function repPrint(){const S=daySales(),w=D.store.w,L=[],l=t=>L.push([t,0,0]),ln=()=>l('-'.repeat(w)),row=(a,b)=>l(a+' '.repeat(Math.max(1,w-a.length-b.length))+b);
L.push([D.store.name,1,1]);L.push(['LAPORAN HARIAN',1,0]);L.push([$('#rdt').value,1,0]);ln();
agg(S).forEach(([n,o])=>{l(n.slice(0,w));row(o.q+' x',rp(o.v))});ln();row('Transaksi',String(S.length));row('TOTAL',rp(S.reduce((a,s)=>a+s.total,0)));out(L)}
function repCsv(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"',R=[['Tanggal','Waktu','Produk','Jumlah','Harga','Subtotal','Pelanggan','HP']];
daySales().forEach(s=>s.items.forEach(i=>R.push([ld(s.t),new Date(s.t).toLocaleTimeString('id-ID'),i.n,i.q,i.p,i.q*i.p,s.c?s.c.n:'',s.c?s.c.h:''])));
dl('laporan-'+$('#rdt').value+'.csv','\ufeff'+R.map(r=>r.map(q).join(',')).join('\n'))}
go('k');
</script><script src="native.js"></script>
