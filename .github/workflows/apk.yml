name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --legacy-peer-deps
      - run: npx cap add android
      - name: Patch Android (izin Bluetooth + minSdk)
        run: |
          cp android-patch/MainActivity.java android/app/src/main/java/com/kasir/toko/MainActivity.java
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" /></manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kasir-toko-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
